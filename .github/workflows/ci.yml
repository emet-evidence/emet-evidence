name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, integration and mutation tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate the example review
        run: python3 -m emet.check_review immobilisation
        env:
          EMET_WORKSPACE: examples/shoulder-surgery
      - name: Build and install the package
        run: |
          python3 -m pip install build
          python3 -m build
          python3 -m pip install dist/*.whl
          cd /tmp && python3 -c "import emet.workspace as w; assert (w.METHODOLOGY / 'pipeline.json').exists(), w.METHODOLOGY"
