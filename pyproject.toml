[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emet-evidence"
dynamic = ["version"]
description = "Open-source framework for autonomous, reproducible and auditable evidence synthesis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-CC-BY-4.0", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Mikaël Chelli" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/emet-evidence/emet-evidence"
Issues = "https://github.com/emet-evidence/emet-evidence/issues"

[tool.hatch.version]
path = "emet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["emet"]

[tool.hatch.build.targets.wheel.force-include]
"methodology" = "emet/methodology"
